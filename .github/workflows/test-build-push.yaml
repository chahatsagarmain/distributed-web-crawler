name: Push to Docker Hub

on:
    push:
        branches:
            - "main"
        tags:
            - "v*"
    pull_request:
        branches:
            - "main"

jobs:
    test-and-build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: 'go.work'

            - name: Run Go tests
              run: |
                go work sync
                go test ./worker/... ./common/... ./scheduler/...

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Extract metadata for scheduler
              id: meta-scheduler
              uses: docker/metadata-action@v5
              with:
                  images: chahatsagarmain/scheduler

            - name: Build and push scheduler
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./scheduler/dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta-scheduler.outputs.tags }}
                  labels: ${{ steps.meta-scheduler.outputs.labels }}

            - name: Extract metadata for worker
              id: meta-worker
              uses: docker/metadata-action@v5
              with:
                  images: chahatsagarmain/worker

            - name: Build and push worker
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./worker/dockerfile
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta-worker.outputs.tags }}
                  labels: ${{ steps.meta-worker.outputs.labels }}
