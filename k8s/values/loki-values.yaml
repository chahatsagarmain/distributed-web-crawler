deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
    bucketNames:
      chunks: filesystem
      ruler: filesystem
      admin: filesystem
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

# Explicitly disable scalable components to avoid validation conflicts
write:
  replicas: 0
read:
  replicas: 0
backend:
  replicas: 0

# Run as a single instance with persistent volume storage
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi
