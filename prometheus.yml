global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'scheduler'
    static_configs:
      - targets: ['scheduler:8080']

  - job_name: 'worker'
    dns_sd_configs:
      - names:
          - 'worker'
        type: 'A'
        port: 8081

  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']